<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Vino Calc — a clean, dark-themed calculator built with vanilla HTML, CSS, and JavaScript."
    />
    <title>Vino Calc</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Outfit:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="page">
      <section class="calculator" aria-label="Vino Calculator">
        <header class="calculator__brand">
          <span class="calculator__brand-mark" aria-hidden="true"></span>
          <h1 class="calculator__title">VINO CALC</h1>
        </header>

        <div class="display" aria-live="polite">
          <div class="display__expression" id="expression"></div>
          <div class="display__result" id="result">0</div>
        </div>

        <div class="keypad" role="group" aria-label="Calculator keypad">
          <button type="button" class="key key--util" data-action="clear">AC</button>
          <button type="button" class="key key--util" data-action="delete">⌫</button>
          <button type="button" class="key key--util" data-action="percent">%</button>
          <button type="button" class="key key--op" data-operator="÷">÷</button>

          <button type="button" class="key" data-number="7">7</button>
          <button type="button" class="key" data-number="8">8</button>
          <button type="button" class="key" data-number="9">9</button>
          <button type="button" class="key key--op" data-operator="×">×</button>

          <button type="button" class="key" data-number="4">4</button>
          <button type="button" class="key" data-number="5">5</button>
          <button type="button" class="key" data-number="6">6</button>
          <button type="button" class="key key--op" data-operator="−">−</button>

          <button type="button" class="key" data-number="1">1</button>
          <button type="button" class="key" data-number="2">2</button>
          <button type="button" class="key" data-number="3">3</button>
          <button type="button" class="key key--op" data-operator="+">+</button>

          <button type="button" class="key key--zero" data-number="0">0</button>
          <button type="button" class="key" data-number=".">.</button>
          <button type="button" class="key key--equals" data-action="equals">=</button>
        </div>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
